name: Space combat mobile preview

on:
  workflow_dispatch:
  push:
    branches: [codex/space-combat-apk]
    paths-ignore: ['docs/**', 'design/**']

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare frozen Android assets
        run: node tools/prepare-android.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock playwright@1.61.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: All levels, power controls and both phone regressions
        env:
          PW_MODULE: file://${{ runner.temp }}/browser-tools/node_modules/playwright/index.mjs
        run: |
          node tools/playtest/combat.mjs out/ci-combat
          node tools/playtest/combat.mjs out/ci-combat-offline android/app/src/main/assets/breach.html
          node tools/playtest/frost.mjs out/ci-frost
          node tools/playtest/frost.mjs out/ci-frost-offline android/app/src/main/assets/breach.html
          node tools/playtest/layout.mjs out/ci-layout
          node tools/playtest/polish.mjs out/ci-polish-ios ios
          node tools/playtest/polish.mjs out/ci-polish-android android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-web-checks-${{ github.run_number }}
          path: |
            dist/
            out/ci-*/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-web-assets
          path: android/app/src/main/assets/
          if-no-files-found: error
          retention-days: 1

  android:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-web-assets
          path: android/app/src/main/assets
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.11.1
      - name: Compile APK and check Android lint
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test offline on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: |
            timeout --kill-after=5s 20s adb shell svc wifi disable
            timeout --kill-after=5s 20s adb shell svc data disable
            timeout --kill-after=5s 20s adb shell settings put secure immersive_mode_confirmations confirmed
            timeout --kill-after=5s 20s adb shell am force-stop com.google.android.apps.nexuslauncher
            bash tools/test-android.sh
      - name: Package installable artifact
        run: |
          mkdir -p out/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/apk/BREACH-Space-combat.apk
          cp android/app/src/main/assets/preview.json out/apk/preview.json
          cp docs/MOBILE_PREVIEW.md out/apk/README.md
          sha256sum out/apk/BREACH-Space-combat.apk > out/apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: BREACH-space-combat-android-${{ github.run_number }}
          path: out/apk/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-evidence-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            out/android-screenshots/
            out/android-window.txt
            out/android-logcat.txt
            out/android-logcat-live.txt
            out/android-host-before.txt
            out/android-host-after.txt
            out/android-devices.txt
          retention-days: 30
